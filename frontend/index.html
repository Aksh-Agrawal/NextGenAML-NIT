<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextGenAML — Anti-Money Laundering Intelligence</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <!-- ── Upload Overlay ─────────────────────────────── -->
    <div id="upload-overlay" style="display: none">
      <div class="overlay-card">
        <div class="overlay-icon">
          <i class="lucide-shield-alert"></i>
        </div>
        <h1>NextGenAML</h1>
        <p class="overlay-sub">
          Upload your transaction data to begin analysis
        </p>
        <form id="overlay-upload-form">
          <label class="file-drop" id="overlay-drop-zone">
            <i class="lucide-upload-cloud"></i>
            <span>Drop CSV file here or click to browse</span>
            <input type="file" accept=".csv" id="overlay-file-input" hidden />
          </label>
          <div class="upload-progress" id="overlay-progress" style="display: none">
            <div class="progress-bar">
              <div class="progress-fill" id="overlay-progress-fill"></div>
            </div>
            <span id="overlay-progress-text">Uploading…</span>
          </div>
        </form>
      </div>
    </div>

    <!-- ── Sidebar ────────────────────────────────────── -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="lucide-shield-check logo-icon"></i>
          <span class="logo-text"><strong>NextGen</strong>AML</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">OVERVIEW</div>
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <i class="lucide-layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="#analytics" class="nav-item" data-page="analytics">
          <i class="lucide-bar-chart-3"></i>
          <span>Analytics</span>
        </a>

        <div class="nav-section-label">INVESTIGATION</div>
        <a href="#accounts" class="nav-item" data-page="accounts">
          <i class="lucide-users"></i>
          <span>Accounts</span>
        </a>
        <a href="#predictions" class="nav-item" data-page="predictions">
          <i class="lucide-brain"></i>
          <span>Predictions</span>
        </a>
        <a href="#alerts" class="nav-item" data-page="alerts">
          <i class="lucide-bell-ring"></i>
          <span>Alerts</span>
        </a>
        <a href="#patterns" class="nav-item" data-page="patterns">
          <i class="lucide-scan"></i>
          <span>Patterns</span>
        </a>
        <a href="#graph" class="nav-item" data-page="graph">
          <i class="lucide-git-branch"></i>
          <span>Graph Explorer</span>
        </a>
        <a href="#timeline" class="nav-item" data-page="timeline">
          <i class="lucide-clock"></i>
          <span>Timeline</span>
        </a>

        <div class="nav-section-label">SYSTEM</div>
        <a href="#reports" class="nav-item" data-page="reports">
          <i class="lucide-file-text"></i>
          <span>Reports</span>
        </a>
        <a href="#model" class="nav-item" data-page="model">
          <i class="lucide-cpu"></i>
          <span>Model Info</span>
        </a>
        <a href="#upload" class="nav-item" data-page="upload">
          <i class="lucide-upload"></i>
          <span>Upload Data</span>
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <i class="lucide-settings"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="health-indicator" id="health-dot">
          <span class="health-dot"></span>
          <span id="health-text">Connecting…</span>
        </div>
      </div>
    </aside>

    <!-- ── Main ───────────────────────────────────────── -->
    <main id="main">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle">
          <i class="lucide-menu"></i>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-right">
          <span class="topbar-clock" id="topbar-clock"></span>
          <span class="topbar-badge" id="topbar-accounts">—</span>
        </div>
      </header>

      <div class="page-container" id="page-container">
        <!-- Page content loaded dynamically by router -->
        <div class="page-loading">
          <p class="muted">Loading…</p>
        </div>
      </div>
    </main>

    <!-- ── Scripts ────────────────────────────────────── -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/router.js"></script>
    <script src="/static/js/pages/dashboard.js"></script>
    <script src="/static/js/pages/analytics.js"></script>
    <script src="/static/js/pages/accounts.js"></script>
    <script src="/static/js/pages/predictions.js"></script>
    <script src="/static/js/pages/alerts.js"></script>
    <script src="/static/js/pages/patterns.js"></script>
    <script src="/static/js/pages/graph.js"></script>
    <script src="/static/js/pages/timeline.js"></script>
    <script src="/static/js/pages/reports.js"></script>
    <script src="/static/js/pages/model.js"></script>
    <script src="/static/js/pages/upload.js"></script>
    <script src="/static/js/pages/settings.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
