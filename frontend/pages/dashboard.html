<div class="kpi-row">
  <div class="kpi-card">
    <div class="kpi-icon kpi-icon-blue"><i class="lucide-receipt"></i></div>
    <div class="kpi-body">
      <div class="kpi-value" id="kpi-transactions">—</div>
      <div class="kpi-label">Total Transactions</div>
    </div>
  </div>
  <div class="kpi-card">
    <div class="kpi-icon kpi-icon-green"><i class="lucide-indian-rupee"></i></div>
    <div class="kpi-body">
      <div class="kpi-value" id="kpi-volume">—</div>
      <div class="kpi-label">Total Volume</div>
    </div>
  </div>
  <div class="kpi-card">
    <div class="kpi-icon kpi-icon-red"><i class="lucide-alert-triangle"></i></div>
    <div class="kpi-body">
      <div class="kpi-value" id="kpi-flagged">—</div>
      <div class="kpi-label">Flagged Amount</div>
    </div>
  </div>
  <div class="kpi-card">
    <div class="kpi-icon kpi-icon-orange"><i class="lucide-shield-alert"></i></div>
    <div class="kpi-body">
      <div class="kpi-value" id="kpi-highrisk">—</div>
      <div class="kpi-label">High Risk Entities</div>
    </div>
  </div>
  <div class="kpi-card">
    <div class="kpi-icon kpi-icon-purple"><i class="lucide-siren"></i></div>
    <div class="kpi-body">
      <div class="kpi-value" id="kpi-active-cases">—</div>
      <div class="kpi-label">Active Cases</div>
    </div>
  </div>
  <div class="kpi-card">
    <div class="kpi-icon kpi-icon-yellow"><i class="lucide-gauge"></i></div>
    <div class="kpi-body">
      <div class="kpi-value" id="kpi-risk-score">—</div>
      <div class="kpi-label">System Risk Score</div>
    </div>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-header">
      <h3><i class="lucide-trending-up"></i> Transaction Trends</h3>
    </div>
    <div class="card-body chart-container">
      <canvas id="dashTrendChart"></canvas>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3><i class="lucide-activity"></i> Recent Suspicious Activity</h3>
    </div>
    <div class="card-body" id="recent-activity">
      <p class="muted">Loading…</p>
    </div>
  </div>
</div>
