<div class="toolbar graph-toolbar">
  <div class="input-group">
    <input type="text" id="graph-account-id" placeholder="Account ID for subgraph…" />
    <button class="btn btn-primary" onclick="loadSubgraph()">
      <i class="lucide-git-branch"></i> Subgraph
    </button>
  </div>
  <button class="btn btn-outline" onclick="loadFullGraph()">
    <i class="lucide-maximize-2"></i> Full Graph
  </button>
  <button class="btn btn-outline" onclick="loadGraphStats()">
    <i class="lucide-bar-chart-2"></i> Stats
  </button>
</div>
<!-- Graph filter bar -->
<div class="graph-filters">
  <div class="filter-group">
    <label class="filter-label">Max Nodes</label>
    <select id="graph-limit" class="filter-select" onchange="loadFullGraph()">
      <option value="50">50</option>
      <option value="100" selected>100</option>
      <option value="200">200</option>
      <option value="500">500</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label">Min Risk %</label>
    <input type="range" id="graph-risk-filter" min="0" max="75" value="0" step="5"
      class="filter-range" oninput="applyGraphRiskFilter()" />
    <span id="graph-risk-val" class="filter-val">0%</span>
  </div>
  <div class="filter-group">
    <label class="filter-label">Edges</label>
    <select id="graph-edge-mode" class="filter-select" onchange="applyGraphEdgeFilter()">
      <option value="all" selected>All Edges</option>
      <option value="suspicious">Suspicious + Warning</option>
      <option value="safe">Safe + Normal</option>
      <option value="none">Hide Edges</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label">Layout</label>
    <select id="graph-layout" class="filter-select" onchange="reLayoutGraph()">
      <option value="force">Force</option>
      <option value="radial">Radial</option>
      <option value="grid">Grid</option>
    </select>
  </div>
  <div class="filter-group">
    <label class="filter-label">Annotations</label>
    <select id="graph-annotations" class="filter-select" onchange="toggleGraphAnnotations()">
      <option value="off">Off</option>
      <option value="edges">Edge Labels</option>
      <option value="risk">Node Risk %</option>
      <option value="all">All</option>
    </select>
  </div>
  <span class="graph-node-count" id="graph-node-count"></span>
</div>
<div class="card graph-card">
  <div class="card-body graph-body">
    <svg id="graph-svg"></svg>
    <div id="graph-tooltip" class="graph-tooltip" style="display:none"></div>
    <div id="graph-legend" class="graph-legend">
      <span class="legend-section">Nodes:</span>
      <span class="legend-item"><span class="legend-dot" style="background:#00b894"></span> Low</span>
      <span class="legend-item"><span class="legend-dot" style="background:#fdcb6e"></span> Medium</span>
      <span class="legend-item"><span class="legend-dot" style="background:#e17055"></span> High</span>
      <span class="legend-item"><span class="legend-dot" style="background:#d63031"></span> Critical</span>
      <span class="legend-divider"></span>
      <span class="legend-section">Edges:</span>
      <span class="legend-item"><span class="legend-line" style="background:#10b981"></span> Safe</span>
      <span class="legend-item"><span class="legend-line" style="background:rgba(255,255,255,0.25)"></span> Normal</span>
      <span class="legend-item"><span class="legend-line" style="background:#fbbf24"></span> Warning</span>
      <span class="legend-item"><span class="legend-line" style="background:#ef4444"></span> Suspicious</span>
    </div>
    <div class="graph-controls">
      <button class="graph-ctrl-btn" onclick="graphZoom(1.3)" title="Zoom In">
        <i class="lucide-zoom-in"></i>
      </button>
      <button class="graph-ctrl-btn" onclick="graphZoom(0.7)" title="Zoom Out">
        <i class="lucide-zoom-out"></i>
      </button>
      <button class="graph-ctrl-btn" onclick="graphResetView()" title="Reset View">
        <i class="lucide-maximize-2"></i>
      </button>
    </div>
  </div>
</div>
<div class="card mt-1" id="graph-stats-panel" style="display:none">
  <div class="card-header">
    <h3><i class="lucide-bar-chart-2"></i> Graph Statistics</h3>
  </div>
  <div class="card-body" id="graph-stats-content"></div>
</div>
