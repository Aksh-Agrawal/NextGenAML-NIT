<div class="grid-2">
  <div class="card">
    <div class="card-header">
      <h3><i class="lucide-upload"></i> Upload Transaction Data</h3>
    </div>
    <div class="card-body">
      <form id="upload-form">
        <label class="file-drop" id="upload-drop-zone">
          <i class="lucide-upload-cloud"></i>
          <span>Drop your CSV file here or click to browse</span>
          <input type="file" accept=".csv" id="upload-file-input" hidden />
        </label>
        <div class="upload-progress" id="upload-progress" style="display:none">
          <div class="progress-bar">
            <div class="progress-fill" id="upload-progress-fill"></div>
          </div>
          <span id="upload-progress-text">Uploading…</span>
        </div>
      </form>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3><i class="lucide-database"></i> Current Dataset</h3>
    </div>
    <div class="card-body" id="upload-status">
      <p class="muted">Loading…</p>
    </div>
  </div>
</div>
