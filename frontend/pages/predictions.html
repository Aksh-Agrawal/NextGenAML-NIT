<div class="grid-3">
  <div class="card">
    <div class="card-header">
      <h3><i class="lucide-brain"></i> Single Prediction</h3>
    </div>
    <div class="card-body">
      <div class="input-group">
        <input type="text" id="predict-account-id" placeholder="Enter Account ID" />
        <button class="btn btn-primary" onclick="singlePredict()">Predict</button>
      </div>
      <div id="predict-result" class="result-box"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3><i class="lucide-layers"></i> Batch Prediction</h3>
    </div>
    <div class="card-body">
      <div class="input-group">
        <input type="text" id="batch-account-ids" placeholder="ACC001, ACC002, ACC003…" />
        <button class="btn btn-primary" onclick="batchPredict()">Run Batch</button>
      </div>
      <div id="batch-result" class="result-box"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3><i class="lucide-radio"></i> Transaction Monitor</h3>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <input type="text" id="mon-sender" placeholder="Sender Account" />
        <input type="text" id="mon-receiver" placeholder="Receiver Account" />
        <input type="number" id="mon-amount" placeholder="Amount" />
        <input type="text" id="mon-type" placeholder="Type (e.g. wire_transfer)" />
      </div>
      <button class="btn btn-primary mt-1" onclick="monitorTransaction()" style="width:100%">
        <i class="lucide-scan"></i> Monitor
      </button>
      <div id="monitor-result" class="result-box"></div>
    </div>
  </div>
</div>
